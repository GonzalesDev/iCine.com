<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCine | Painel do Administrador</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #111827;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --red: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 900px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1f2937; margin-bottom: 30px; }
        .logo { font-size: 1.8rem; font-weight: 900; background: linear-gradient(to right, var(--purple), var(--pink)); -webkit-background-clip: text; color: transparent; }
        .badge-admin { background: var(--purple); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }

        .grid-container { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .grid-container { grid-template-columns: 1fr 1fr; } }

        .card-box { background-color: var(--card-bg); border: 1px solid #1f2937; border-radius: 16px; padding: 20px; }
        .card-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; color: white; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #374151; background-color: #1f2937; color: white; font-size: 0.95rem; outline: none; }
        input:focus { border-color: var(--purple); }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--purple), #6d28d9); color: white; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-danger { background-color: var(--red); color: white; padding: 6px 12px; font-size: 0.8rem; width: auto; border-radius: 6px; }

        /* Preview Card */
        .preview-box { display: none; margin-top: 15px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #374151; }
        .preview-content { display: flex; gap: 12px; padding: 12px; align-items: center; background: rgba(31, 41, 55, 0.8); }
        .preview-poster { width: 50px; height: 75px; object-fit: cover; border-radius: 6px; }
        .preview-title { font-weight: bold; font-size: 0.95rem; }
        .preview-video { width: 100%; max-height: 250px; background: #000; display: block; }

        /* Dropdown de Busca */
        #resultado-busca { display: none; position: absolute; width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 8px; z-index: 10; max-height: 200px; overflow-y: auto; margin-top: 5px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .busca-item { padding: 10px; border-bottom: 1px solid #374151; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
        .busca-item:hover { background: #374151; }
        .busca-thumb { width: 30px; height: 45px; object-fit: cover; border-radius: 4px; }

        /* Tabela de Cenas */
        .cena-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #1f2937; border-radius: 10px; margin-bottom: 10px; border: 1px solid #374151; }
        .cena-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .cena-detalhes { overflow: hidden; }
        .cena-nome { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cena-link { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

        #status-msg { margin-top: 12px; font-size: 0.85rem; font-weight: bold; text-align: center; min-height: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">iCine</div>
        <span class="badge-admin">Painel do Administrador</span>
    </header>

    <div class="grid-container">
        <!-- FORMULÁRIO DE CADASTRO -->
        <div class="card-box">
            <h2 class="card-title">⚡ Cadastrar Nova Cena (Short)</h2>
            
            <!-- NOVA BARRA DE PESQUISA -->
            <div class="form-group">
                <label for="buscar-filme">🔍 Buscar Filme pelo Nome:</label>
                <input type="text" id="buscar-filme" placeholder="Digite o nome do filme..." autocomplete="off">
                <div id="resultado-busca"></div>
            </div>

            <div class="form-group">
                <label for="tmdb-id">1. ID do Filme no TMDB:</label>
                <input type="number" id="tmdb-id" placeholder="O ID aparecerá aqui após a busca" readonly style="opacity: 0.7;">
            </div>

            <div class="form-group">
                <label for="video-url">2. Link Direto do Vídeo (MP4):</label>
                <input type="text" id="video-url" placeholder="https://.../video.mp4">
            </div>

            <button id="btn-verificar" class="btn btn-primary" style="margin-bottom: 10px; background: #374151;">🔍 Verificar e Pré-visualizar</button>
            <button id="btn-salvar" class="btn btn-primary">🚀 Publicar Cena no Feed</button>

            <p id="status-msg"></p>

            <!-- Card de Pré-visualização -->
            <div id="preview-box" class="preview-box">
                <video id="preview-video" class="preview-video" controls muted></video>
                <div class="preview-content">
                    <img id="preview-poster" class="preview-poster" src="" alt="Capa">
                    <div>
                        <div id="preview-titulo" class="preview-title">Título do Filme</div>
                        <div id="preview-ano" style="font-size: 0.8rem; color: var(--text-muted);">Ano</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LISTA DE CENAS CADASTRADAS -->
        <div class="card-box">
            <h2 class="card-title">🎬 Cenas Ativas no App (<span id="total-cenas">0</span>)</h2>
            <div id="lista-cenas" style="max-height: 500px; overflow-y: auto;">
                <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">Carregando feed...</p>
            </div>
        </div>
    </div>

    <script>
        const TMDB_KEY = '583c7b5c219b1edbfc6a76210b4ade05';
        const SUPABASE_URL = 'https://kvwwbnwpnrzghgblgjpj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_t8yBlNHrYW82WH4LiEVNmQ_yVw5Jzlk';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let filmeDetectado = null;

        // SISTEMA DE BUSCA DE FILMES (NOVO)
        document.getElementById('buscar-filme').addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            const boxResultados = document.getElementById('resultado-busca');

            if (query.length < 3) {
                boxResultados.style.display = 'none';
                return;
            }

            try {
                const resp = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=pt-BR&query=${encodeURIComponent(query)}`);
                const data = await resp.json();

                if (data.results && data.results.length > 0) {
                    boxResultados.innerHTML = data.results.slice(0, 5).map(filme => `
                        <div class="busca-item" onclick="selecionarFilme(${filme.id}, '${filme.title.replace(/'/g, "\\'")}')">
                            <img src="${filme.poster_path ? 'https://image.tmdb.org/t/p/w92' + filme.poster_path : 'https://via.placeholder.com/40x60'}" class="busca-thumb">
                            <div>
                                <div style="font-weight: bold; font-size: 0.9rem;">${filme.title}</div>
                                <div style="font-size: 0.75rem; color: #9ca3af;">${filme.release_date ? filme.release_date.split('-')[0] : 'N/A'}</div>
                            </div>
                        </div>
                    `).join('');
                    boxResultados.style.display = 'block';
                } else {
                    boxResultados.innerHTML = '<div style="padding: 10px; color: #9ca3af; text-align: center; font-size: 0.85rem;">Nenhum filme encontrado.</div>';
                    boxResultados.style.display = 'block';
                }
            } catch (err) {
                console.error("Erro na busca:", err);
            }
        });

        // Selecionar filme na busca
        window.selecionarFilme = function(id, titulo) {
            document.getElementById('tmdb-id').value = id;
            document.getElementById('buscar-filme').value = titulo;
            document.getElementById('resultado-busca').style.display = 'none';
        };

        // Fechar dropdown ao clicar fora
        document.addEventListener('click', (e) => {
            if (e.target.id !== 'buscar-filme') {
                document.getElementById('resultado-busca').style.display = 'none';
            }
        });

        // 1. VERIFICAR ID NO TMDB E ARQUIVO DE VÍDEO
        document.getElementById('btn-verificar').addEventListener('click', async () => {
            const tmdbId = document.getElementById('tmdb-id').value.trim();
            const videoUrl = document.getElementById('video-url').value.trim();
            const msg = document.getElementById('status-msg');
            const previewBox = document.getElementById('preview-box');

            if (!tmdbId || !videoUrl) {
                msg.style.color = 'var(--red)';
                msg.innerText = 'Selecione um filme e preencha o link do vídeo!';
                return;
            }

            msg.style.color = 'var(--purple)';
            msg.innerText = 'A buscar dados no TMDB... ⏳';

            try {
                const resp = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${TMDB_KEY}&language=pt-BR`);
                if (!resp.ok) throw new Error("Filme não encontrado no TMDB.");

                const filme = await resp.json();
                filmeDetectado = {
                    tmdb_id: filme.id,
                    titulo: filme.title,
                    capa: filme.poster_path ? `https://image.tmdb.org/t/p/w500${filme.poster_path}` : 'https://via.placeholder.com/50x75?text=Sem+Capa'
                };

                document.getElementById('preview-titulo').innerText = filme.title;
                document.getElementById('preview-ano').innerText = filme.release_date ? filme.release_date.split('-')[0] : 'N/A';
                document.getElementById('preview-poster').src = filmeDetectado.capa;
                document.getElementById('preview-video').src = videoUrl;

                previewBox.style.display = 'block';
                msg.style.color = '#10b981';
                msg.innerText = '✓ Filme encontrado! Confirme o vídeo e clique em Publicar.';

            } catch (err) {
                msg.style.color = 'var(--red)';
                msg.innerText = 'Erro: ' + err.message;
                previewBox.style.display = 'none';
            }
        });

        // 2. ENVIAR PARA O SUPABASE
        document.getElementById('btn-salvar').addEventListener('click', async () => {
            const tmdbId = document.getElementById('tmdb-id').value.trim();
            const videoUrl = document.getElementById('video-url').value.trim();
            const msg = document.getElementById('status-msg');

            if (!tmdbId || !videoUrl) {
                msg.style.color = 'var(--red)';
                msg.innerText = 'Preencha todos os campos antes de publicar!';
                return;
            }

            msg.style.color = 'var(--purple)';
            msg.innerText = 'A enviar para o Supabase... ⏳';

            const novaCena = {
                tmdb_id: parseInt(tmdbId),
                video_url: videoUrl,
                nome_filme: filmeDetectado ? filmeDetectado.titulo : document.getElementById('buscar-filme').value,
                curtidas: [],
                comentarios: []
            };

            const { error } = await supabaseClient.from('cenas_shorts').insert([novaCena]);

            if (error) {
                msg.style.color = 'var(--red)';
                msg.innerText = 'Erro ao salvar no banco: ' + error.message;
            } else {
                msg.style.color = '#10b981';
                msg.innerText = '✅ Cena publicada com sucesso no Feed do iCine!';
                
                document.getElementById('tmdb-id').value = '';
                document.getElementById('buscar-filme').value = '';
                document.getElementById('video-url').value = '';
                document.getElementById('preview-box').style.display = 'none';
                filmeDetectado = null;

                carregarCenasExistentes();
            }
        });

        // 3. CARREGAR E GERENCIAR CENAS CADASTRADAS
        async function carregarCenasExistentes() {
            const listaDiv = document.getElementById('lista-cenas');
            const totalSpan = document.getElementById('total-cenas');

            const { data: cenas, error } = await supabaseClient.from('cenas_shorts').select('*').order('created_at', { ascending: false });

            if (error || !cenas || cenas.length === 0) {
                listaDiv.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">Nenhuma cena cadastrada até o momento.</p>';
                totalSpan.innerText = '0';
                return;
            }

            totalSpan.innerText = cenas.length;

            listaDiv.innerHTML = cenas.map(c => `
                <div class="cena-item">
                    <div class="cena-info">
                        <div class="cena-detalhes">
                            <div class="cena-nome">${c.nome_filme || 'Filme ID: ' + c.tmdb_id}</div>
                            <div class="cena-link">${c.video_url}</div>
                        </div>
                    </div>
                    <button class="btn btn-danger" onclick="apagarCena('${c.id}')">Excluir</button>
                </div>
            `).join('');
        }

        async function apagarCena(idCena) {
            if (confirm('Tem certeza que deseja apagar esta cena do Feed?')) {
                const { error } = await supabaseClient.from('cenas_shorts').delete().eq('id', idCena);
                if (!error) {
                    carregarCenasExistentes();
                } else {
                    alert('Erro ao excluir cena: ' + error.message);
                }
            }
        }

        // Inicialização
        carregarCenasExistentes();
    </script>
</body>
</html>
